# Regression-detector tolerance for `cargo crap --fail-regression`.
#
# CRAP = cc^2 * (1 - coverage)^3 + cc, so for a moderately complex function a
# single covered/uncovered line (a few percent of coverage) moves the score by
# a few tenths. Combined with run-to-run coverage jitter in the parallel job
# machinery, the default epsilon (0.01) flags pure measurement noise as a
# "regression". 0.1 absorbs that floor while still catching real regressions,
# which on this codebase are >= 1.0 (a complexity increase, or a function whose
# coverage collapses).
epsilon = 0.1
