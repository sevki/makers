name: Fuzzing

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz tests
        # Seed from the existing makefile test fixtures (passed as a read-only
        # extra corpus dir) while new inputs are written to the fuzzer's own
        # corpus dir, so the fixtures aren't modified. Short, CI-friendly run.
        run: |
          mkdir -p fuzz/corpus/parser
          cargo +nightly fuzz run parser fuzz/corpus/parser tests/fixtures -- -max_total_time=30
        timeout-minutes: 10
