name: CI

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust-make-builds-c-make:
        name: rust make builds C make
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential clang m4 perl \
                    automake autopoint gettext gperf texinfo \
                    git wget xz-utils

            # bootstrap.conf requires autoconf >= 2.72; ubuntu-latest still ships 2.71.
            - name: Install autoconf 2.72 from source
              run: |
                  AC_VER=2.72
                  cd /tmp
                  curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-${AC_VER}.tar.xz
                  tar xJf autoconf-${AC_VER}.tar.xz
                  cd autoconf-${AC_VER}
                  ./configure --prefix=/usr/local
                  make -j"$(nproc)"
                  sudo make install
                  autoconf --version | head -1

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: cargo-${{ runner.os }}-

            - name: Run ci-test.sh (rust make + C make)
              run: ./scripts/ci-test.sh --skip-kernel

            - name: Upload rust make binary
              uses: actions/upload-artifact@v4
              with:
                  name: rust-make-${{ github.sha }}
                  path: target/install/bin/make
                  if-no-files-found: error
                  retention-days: 7

    kernel-build:
        name: rust make builds Linux kernel (okLinux)
        needs: rust-make-builds-c-make
        runs-on: ubuntu-latest
        steps:
            - name: Download rust make artifact
              uses: actions/download-artifact@v4
              with:
                  name: rust-make-${{ github.sha }}
                  path: rust-make

            - name: Put rust make first on PATH as `make`
              run: |
                  chmod +x rust-make/make
                  mkdir -p "$HOME/.local/bin"
                  ln -sf "$PWD/rust-make/make" "$HOME/.local/bin/make"
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Verify
              run: |
                  which make
                  make --version | head -2

            - name: Build Linux kernel via okLinux build.sh
              working-directory: ${{ runner.temp }}
              run: |
                  curl -fsSL \
                    https://raw.githubusercontent.com/sevki/okLinux/refs/heads/main/build.sh \
                    -o build.sh
                  chmod +x build.sh
                  ./build.sh

    coverage:
        name: coverage (cargo-llvm-cov)
        runs-on: ubuntu-latest
        # Informational for now: the report is uploaded as an artifact, printed
        # to the run summary, and posted as a PR comment, but a failure here
        # does not block the run. Flip this to false (and optionally add a
        # threshold) once it has settled.
        continue-on-error: true
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v4

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential clang m4 perl \
                    automake autopoint gettext gperf texinfo \
                    git wget xz-utils curl

            # bootstrap.conf requires autoconf >= 2.72; ubuntu-latest still ships 2.71.
            - name: Install autoconf 2.72 from source
              run: |
                  AC_VER=2.72
                  cd /tmp
                  curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-${AC_VER}.tar.xz
                  tar xJf autoconf-${AC_VER}.tar.xz
                  cd autoconf-${AC_VER}
                  ./configure --prefix=/usr/local
                  make -j"$(nproc)"
                  sudo make install

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-cov-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: cargo-cov-${{ runner.os }}-

            # llvm-cov reads coverage with the pinned toolchain's LLVM tools.
            - name: Add llvm-tools-preview
              run: rustup component add llvm-tools-preview

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            # Build the in-tree C `make` that the differential tests use as an
            # oracle. build.sh bootstraps the tree with sh+cc only and leaves a
            # C `make` in the repo root, which is exactly what tests/ looks for.
            - name: Build C make oracle
              run: |
                  [ -x configure ] || ./bootstrap
                  [ -f config.status ] || ./configure --quiet
                  ./build.sh
                  test -x ./make

            # The Rust port no longer links libgnu, so the instrumented binary
            # builds against libc alone. cargo-llvm-cov also instruments the
            # spawned `make` binary, so coverage reflects real recipe execution.
            - name: Run tests under coverage
              run: |
                  cargo llvm-cov --workspace --lcov --output-path lcov.info
                  cargo llvm-cov report --summary-only | tee coverage-summary.txt

            - name: Write coverage to job summary
              if: always() && hashFiles('coverage-summary.txt') != ''
              run: |
                  {
                    echo '## Coverage (cargo-llvm-cov)'
                    echo ''
                    echo '```'
                    cat coverage-summary.txt
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Comment coverage on PR
              if: github.event_name == 'pull_request' && hashFiles('coverage-summary.txt') != ''
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const summary = fs.readFileSync('coverage-summary.txt', 'utf8').trimEnd();
                      const marker = '<!-- cargo-llvm-cov-coverage -->';
                      const body = [
                        marker,
                        '## Coverage (cargo-llvm-cov)',
                        '',
                        '```',
                        summary,
                        '```',
                        '',
                        `_commit ${context.sha.slice(0, 7)}_`,
                      ].join('\n');
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(
                        github.rest.issues.listComments,
                        { owner, repo, issue_number, per_page: 100 },
                      );
                      const existing = comments.find(
                        (c) => c.body && c.body.includes(marker),
                      );
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner, repo, comment_id: existing.id, body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner, repo, issue_number, body,
                        });
                      }

            - name: Upload coverage report
              if: always() && hashFiles('lcov.info') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ github.sha }}
                  path: |
                      lcov.info
                      coverage-summary.txt
                  if-no-files-found: error
