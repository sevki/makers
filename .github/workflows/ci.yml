name: CI

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# ./bootstrap clones gnulib from this URL; the savannah default is often
# slow/unreachable from CI, so use a GitHub mirror. The pinned revision
# still comes from bootstrap.conf (GNULIB_REVISION), which the mirror carries.
env:
    GNULIB_URL: https://github.com/sevki/gnulib.git

jobs:
    rust-make-builds-c-make:
        name: rust make builds C make
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential clang m4 perl \
                    automake autopoint gettext gperf texinfo \
                    git wget xz-utils

            # bootstrap.conf requires autoconf >= 2.72; ubuntu-latest still ships 2.71.
            - name: Install autoconf 2.72 from source
              run: |
                  AC_VER=2.72
                  cd /tmp
                  curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-${AC_VER}.tar.xz
                  tar xJf autoconf-${AC_VER}.tar.xz
                  cd autoconf-${AC_VER}
                  ./configure --prefix=/usr/local
                  make -j"$(nproc)"
                  sudo make install
                  autoconf --version | head -1

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: cargo-${{ runner.os }}-

            - name: Run ci-test.sh (rust make + C make)
              run: ./scripts/ci-test.sh --skip-kernel

            - name: Upload rust make binary
              uses: actions/upload-artifact@v4
              with:
                  name: rust-make-${{ github.sha }}
                  path: target/install/bin/make
                  if-no-files-found: error
                  retention-days: 7

            # The C make built by ci-test.sh stage 3 (the in-tree ./make) is the
            # oracle for the differential kernel build below.
            - name: Upload C make binary
              uses: actions/upload-artifact@v4
              with:
                  name: c-make-${{ github.sha }}
                  path: make
                  if-no-files-found: error
                  retention-days: 7

    # Build the Linux kernel twice — once with the Rust make, once with the C
    # make — in parallel, then diff their stdout/stderr to catch regressions
    # where the Rust make drives the build differently from upstream make.
    kernel-build-rust:
        name: build Linux kernel (rust make)
        needs: rust-make-builds-c-make
        runs-on: ubuntu-latest
        steps:
            - name: Download rust make artifact
              uses: actions/download-artifact@v4
              with:
                  name: rust-make-${{ github.sha }}
                  path: make-bin
            - name: Put rust make first on PATH as `make`
              run: |
                  chmod +x make-bin/make
                  mkdir -p "$HOME/.local/bin"
                  ln -sf "$PWD/make-bin/make" "$HOME/.local/bin/make"
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: Verify
              run: make --version | head -2
            - name: Build Linux kernel via okLinux build.sh
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p rust-kernel && cd rust-kernel
                  curl -fsSL \
                    https://raw.githubusercontent.com/sevki/okLinux/refs/heads/main/build.sh \
                    -o build.sh
                  chmod +x build.sh
                  # Capture stdout/stderr separately; record the exit code rather
                  # than failing the job, so the kernel-diff job is the single
                  # arbiter (and can compare even a failing build's output).
                  set +e
                  ./build.sh >kernel-stdout.log 2>kernel-stderr.log
                  echo $? >kernel-exit.txt
                  set -e
                  echo "rust make kernel build exit: $(cat kernel-exit.txt)"
                  tail -n 20 kernel-stderr.log || true
            - name: Upload rust make kernel logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-logs-rust-${{ github.sha }}
                  path: ${{ runner.temp }}/rust-kernel/kernel-*.log
                  retention-days: 7
            - name: Upload rust make kernel exit code
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-exit-rust-${{ github.sha }}
                  path: ${{ runner.temp }}/rust-kernel/kernel-exit.txt

    kernel-build-c:
        name: build Linux kernel (C make)
        needs: rust-make-builds-c-make
        runs-on: ubuntu-latest
        steps:
            - name: Download C make artifact
              uses: actions/download-artifact@v4
              with:
                  name: c-make-${{ github.sha }}
                  path: make-bin
            - name: Put C make first on PATH as `make`
              run: |
                  chmod +x make-bin/make
                  mkdir -p "$HOME/.local/bin"
                  ln -sf "$PWD/make-bin/make" "$HOME/.local/bin/make"
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: Verify
              run: make --version | head -2
            - name: Build Linux kernel via okLinux build.sh
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p c-kernel && cd c-kernel
                  curl -fsSL \
                    https://raw.githubusercontent.com/sevki/okLinux/refs/heads/main/build.sh \
                    -o build.sh
                  chmod +x build.sh
                  set +e
                  ./build.sh >kernel-stdout.log 2>kernel-stderr.log
                  echo $? >kernel-exit.txt
                  set -e
                  echo "C make kernel build exit: $(cat kernel-exit.txt)"
                  tail -n 20 kernel-stderr.log || true
            - name: Upload C make kernel logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-logs-c-${{ github.sha }}
                  path: ${{ runner.temp }}/c-kernel/kernel-*.log
                  retention-days: 7
            - name: Upload C make kernel exit code
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-exit-c-${{ github.sha }}
                  path: ${{ runner.temp }}/c-kernel/kernel-exit.txt

    kernel-diff:
        name: diff kernel builds (rust make vs C make)
        needs: [kernel-build-rust, kernel-build-c]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Download rust make kernel logs
              uses: actions/download-artifact@v4
              with:
                  pattern: kernel-*-rust-${{ github.sha }}
                  path: rust-logs
                  merge-multiple: true
            - name: Download C make kernel logs
              uses: actions/download-artifact@v4
              with:
                  pattern: kernel-*-c-${{ github.sha }}
                  path: c-logs
                  merge-multiple: true
            - name: Compare stdout/stderr
              run: ./scripts/kernel-diff.sh c-logs rust-logs
            - name: Upload normalized diffs
              if: always() && hashFiles('*.diff') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: kernel-diff-${{ github.sha }}
                  path: "*.diff"
