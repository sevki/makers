# cargo-geiger detects usage of unsafe Rust in this crate and all of its
# dependencies. Because this is a C2Rust port of GNU make, the crate itself is
# unsafe-heavy by design; the value here is tracking that surface over time and
# keeping an eye on the unsafe footprint pulled in by dependencies.
# More details at https://github.com/geiger-rs/cargo-geiger
name: cargo-geiger

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

concurrency:
    group: cargo-geiger-${{ github.ref }}
    cancel-in-progress: true

# Pin cargo-geiger so the gate's HEAD count and the committed baseline are
# produced by the SAME release. The committed `.cargo-geiger-baseline` (155677)
# was generated with this version; a different release can count unsafe
# differently, which would make unchanged PRs fail or let real additions pass.
# The version is baked into the binary cache key (shared by both jobs below) so
# a cache hit can never resurrect an unpinned build. Bump here AND refresh the
# baseline together: bash scripts/geiger-unsafe-count.sh > .cargo-geiger-baseline
env:
    GEIGER_VERSION: "0.13.0"

jobs:
    cargo-geiger:
        name: Scan unsafe usage with cargo-geiger
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af #@v1
              with:
                  profile: minimal
                  toolchain: nightly-2026-05-04
                  override: true

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: cargo-${{ runner.os }}-

            - name: Cache cargo-geiger binary
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/cargo-geiger
                  key: cargo-geiger-bin-${{ runner.os }}-${{ env.GEIGER_VERSION }}

            - name: Install cargo-geiger
              run: |
                  if ! command -v cargo-geiger >/dev/null 2>&1; then
                      cargo install cargo-geiger --version "${GEIGER_VERSION}" --locked
                  fi
                  cargo geiger --version

            # cargo-geiger returns a non-zero exit code when unsafe usage is
            # found, which is expected for a C2Rust port. Capture the report and
            # never fail the job on the unsafe count itself; this job is a
            # tracking dashboard, not a gate.
            - name: Run cargo-geiger
              run: |
                  set +e
                  cargo geiger \
                      --all-features \
                      --output-format Ascii \
                      2>&1 | tee cargo-geiger.txt
                  echo "cargo-geiger exit: ${PIPESTATUS[0]}"
                  set -e

            - name: Publish report to job summary
              if: always()
              run: |
                  {
                      echo '## cargo-geiger unsafe usage report'
                      echo ''
                      echo '```'
                      cat cargo-geiger.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload cargo-geiger report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: cargo-geiger-${{ github.sha }}
                  path: cargo-geiger.txt
                  if-no-files-found: error
                  retention-days: 30

            # Maintain a single tracking issue with the latest report. We look
            # up an existing open issue by its fixed title and edit it in place,
            # so reruns refresh one issue instead of spamming new ones. Limited
            # to main/master pushes and manual runs to avoid touching issues on
            # every PR.
            - name: Open or update tracking issue
              if: >
                  always() &&
                  (github.ref == 'refs/heads/main' ||
                   github.ref == 'refs/heads/master' ||
                   github.event_name == 'workflow_dispatch')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TITLE="cargo-geiger: unsafe usage report"
                  LABEL="cargo-geiger"

                  # Ensure the label exists (idempotent; ignore "already exists").
                  gh label create "$LABEL" \
                      --color FFA500 \
                      --description "Automated cargo-geiger unsafe-usage report" \
                      2>/dev/null || true

                  # GitHub caps issue bodies at 65536 chars; leave headroom for
                  # the surrounding markdown and truncate the report if needed.
                  REPORT=$(head -c 60000 cargo-geiger.txt)
                  {
                      echo "Automated unsafe-usage report from cargo-geiger."
                      echo ""
                      echo "- Commit: \`${GITHUB_SHA}\`"
                      echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                      echo "- Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                      echo ""
                      echo '```'
                      echo "$REPORT"
                      echo '```'
                  } > issue-body.md

                  EXISTING=$(gh issue list \
                      --state open \
                      --search "\"$TITLE\" in:title" \
                      --json number,title \
                      --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

                  if [ -n "$EXISTING" ]; then
                      gh issue edit "$EXISTING" --body-file issue-body.md
                      echo "Updated existing issue #$EXISTING"
                  else
                      gh issue create \
                          --title "$TITLE" \
                          --label "$LABEL" \
                          --body-file issue-body.md
                  fi

    # DIFF GATE: fail a PR only when it ADDS unsafe to the make-sys crate's own
    # code. We gate on REGRESSION, not an absolute number: as a C2Rust port of
    # GNU make the crate is unsafe-heavy by design, so an absolute threshold
    # would be red on every PR. The trusted baseline is the make-sys own-unsafe
    # count on origin/main, stored in .cargo-geiger-baseline (a bare integer).
    # This mirrors the CRAP regression gate in change-risk.yml.
    #
    # Refresh the baseline (e.g. after an intentional, reviewed unsafe addition)
    # with:  bash scripts/geiger-unsafe-count.sh > .cargo-geiger-baseline
    geiger-gate:
        name: Gate on new unsafe in make-sys
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af #@v1
              with:
                  profile: minimal
                  toolchain: nightly-2026-05-04
                  override: true

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: cargo-${{ runner.os }}-

            - name: Cache cargo-geiger binary
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/cargo-geiger
                  key: cargo-geiger-bin-${{ runner.os }}-${{ env.GEIGER_VERSION }}

            - name: Install cargo-geiger
              run: |
                  if ! command -v cargo-geiger >/dev/null 2>&1; then
                      cargo install cargo-geiger --version "${GEIGER_VERSION}" --locked
                  fi
                  cargo geiger --version

            # Gate against the TRUSTED baseline on the PR's BASE branch, not the
            # one in the PR worktree. Otherwise a PR could add unsafe and bump
            # .cargo-geiger-baseline in the same diff, so the comparison would be
            # new-vs-new and never fire. Resolve from the actual base branch
            # (github.base_ref) so PRs into master/maintenance branches compare
            # against the right tree; until that branch carries a baseline, fall
            # back to the in-tree file.
            - name: Resolve trusted baseline
              run: |
                  BASE_REF="${{ github.base_ref }}"
                  git fetch --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
                  if git show "origin/${BASE_REF}:.cargo-geiger-baseline" > main-geiger-baseline 2>/dev/null; then
                      echo "Using ${BASE_REF}-branch geiger baseline"
                  else
                      echo "No baseline on ${BASE_REF} yet; falling back to in-tree baseline"
                      cp .cargo-geiger-baseline main-geiger-baseline
                  fi

            # cargo-geiger exits non-zero whenever unsafe is present (expected
            # for this crate); the script handles that and prints only the
            # make-sys own-unsafe integer.
            - name: Compute current count
              id: count
              run: |
                  HEAD_N=$(bash scripts/geiger-unsafe-count.sh)
                  echo "current make-sys unsafe count: $HEAD_N"
                  echo "head_n=$HEAD_N" >> "$GITHUB_OUTPUT"

            - name: Gate
              run: |
                  BASE_N=$(tr -d '[:space:]' < main-geiger-baseline)
                  HEAD_N="${{ steps.count.outputs.head_n }}"
                  {
                      echo "## cargo-geiger unsafe gate (make-sys)"
                      echo ""
                      echo "- Trusted baseline (origin/main): \`$BASE_N\`"
                      echo "- This PR: \`$HEAD_N\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ "$HEAD_N" -gt "$BASE_N" ]; then
                      DELTA=$((HEAD_N - BASE_N))
                      echo "::error::cargo-geiger: make-sys unsafe count increased: $BASE_N -> $HEAD_N (+$DELTA). New unsafe was added to the crate. If intentional, refresh the baseline: bash scripts/geiger-unsafe-count.sh > .cargo-geiger-baseline"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo "**FAILED**: unsafe count increased by $DELTA. If intentional, refresh the baseline: \`bash scripts/geiger-unsafe-count.sh > .cargo-geiger-baseline\`" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  if [ "$HEAD_N" -lt "$BASE_N" ]; then
                      echo "make-sys unsafe count decreased: $BASE_N -> $HEAD_N. The baseline can be lowered: bash scripts/geiger-unsafe-count.sh > .cargo-geiger-baseline"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo "Note: unsafe count decreased; the baseline can be lowered." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  echo "OK: make-sys unsafe count did not increase ($HEAD_N <= $BASE_N)."
