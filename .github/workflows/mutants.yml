name: Mutation testing

on:
    workflow_dispatch:
    schedule:
        # Weekly run (Mondays 06:00 UTC).
        - cron: "0 6 * * 1"

concurrency:
    group: mutants-${{ github.ref }}
    cancel-in-progress: true

# ./bootstrap clones gnulib from this URL; the savannah default is often
# slow/unreachable from CI, so use a GitHub mirror. The pinned revision
# still comes from bootstrap.conf (GNULIB_REVISION), which the mirror carries.
env:
    GNULIB_URL: https://github.com/sevki/gnulib.git

jobs:
    mutants:
        name: mutation testing (cargo-mutants)
        # Mutation testing runs the whole suite once per mutant, so it is far
        # too slow for every PR. Run it on the weekly schedule or on demand
        # (Actions -> CI -> Run workflow). Scope is set in .cargo/mutants.toml.
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential clang m4 perl \
                    automake autopoint gettext gperf texinfo \
                    git wget xz-utils curl

            # bootstrap.conf requires autoconf >= 2.72; ubuntu-latest still ships 2.71.
            - name: Install autoconf 2.72 from source
              run: |
                  AC_VER=2.72
                  cd /tmp
                  curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-${AC_VER}.tar.xz
                  tar xJf autoconf-${AC_VER}.tar.xz
                  cd autoconf-${AC_VER}
                  ./configure --prefix=/usr/local
                  make -j"$(nproc)"
                  sudo make install

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: cargo-mutants-${{ runner.os }}-

            - name: Install cargo-mutants
              uses: taiki-e/install-action@cargo-mutants

            # The differential tests need the in-tree C `make` as an oracle, so
            # the cargo-mutants baseline (an unmutated test run) passes.
            - name: Build C make oracle
              run: |
                  [ -x configure ] || ./bootstrap
                  [ -f config.status ] || ./configure --quiet
                  ./build.sh
                  test -x ./make

            # Writes its report to ./mutants.out by default.
            - name: Run cargo-mutants
              run: cargo mutants --no-shuffle

            - name: Upload mutants report
              if: always() && hashFiles('mutants.out/**') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: mutants-${{ github.sha }}
                  path: mutants.out
                  if-no-files-found: warn
