name: change-risk

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: change-risk-${{ github.ref }}
    cancel-in-progress: true

# ./bootstrap clones gnulib from this URL; the savannah default is often
# slow/unreachable from CI, so use a GitHub mirror (same as coverage.yml).
env:
    GNULIB_URL: https://github.com/sevki/gnulib.git

# Read-only: this job only checks out code and reports. The PR comment is
# posted by the companion change-risk-comment.yml workflow, which holds the
# pull-requests:write scope.
permissions:
    contents: read

jobs:
    cargo-crap:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # The Rust port is pinned to a nightly via rust-toolchain.toml;
            # rustup honors that file automatically, so we only need its
            # llvm-tools for coverage instrumentation.
            - name: Add llvm-tools-preview
              run: rustup component add llvm-tools-preview

            - uses: taiki-e/install-action@cargo-llvm-cov

            # Build dependencies for bootstrapping the in-tree C make oracle
            # that the differential integration tests shell out to.
            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential clang m4 perl \
                    automake autopoint gettext gperf texinfo \
                    git wget xz-utils curl

            # bootstrap.conf requires autoconf >= 2.72; ubuntu-latest ships 2.71.
            - name: Install autoconf 2.72 from source
              run: |
                  AC_VER=2.72
                  cd /tmp
                  curl -fsSLO https://ftp.gnu.org/gnu/autoconf/autoconf-${AC_VER}.tar.xz
                  tar xJf autoconf-${AC_VER}.tar.xz
                  cd autoconf-${AC_VER}
                  ./configure --prefix=/usr/local
                  make -j"$(nproc)"
                  sudo make install

            - name: Build C make oracle
              run: |
                  [ -x configure ] || ./bootstrap
                  [ -f config.status ] || ./configure --quiet
                  ./build.sh
                  test -x ./make

            - run: cargo install cargo-crap

            # Gate against the TRUSTED main-branch baseline, not the one in the
            # PR worktree. Otherwise a PR could raise a function's CRAP score and
            # bump .cargo-crap-baseline.json in the same diff, so --fail-regression
            # would compare new-vs-new and never fire. We resolve the baseline
            # from origin/main; until main carries one (e.g. this bootstrapping
            # PR), fall back to the in-tree file.
            - name: Resolve trusted baseline
              run: |
                  git fetch --depth=1 origin main:refs/remotes/origin/main || true
                  if git show origin/main:.cargo-crap-baseline.json > main-baseline.json 2>/dev/null; then
                      echo "Using main-branch CRAP baseline"
                  else
                      echo "No baseline on main yet; falling back to in-tree baseline"
                      cp .cargo-crap-baseline.json main-baseline.json
                  fi

            # --ignore-run-fail keeps coverage flowing even if a flaky
            # integration test fails, so the CRAP gate scores real data.
            - run: cargo llvm-cov --ignore-run-fail --lcov --output-path lcov.info

            # Render the PR-comment report (deltas vs baseline). Generated
            # before the gate so a regression failure still publishes the
            # comment. The pr-comment format emits its own
            # `<!-- cargo-crap-report -->` marker, which the companion workflow
            # uses to find and update an existing comment instead of stacking
            # new ones. Function and Location cells auto-link to source via
            # GITHUB_SERVER_URL / GITHUB_REPOSITORY / GITHUB_SHA, set by Actions.
            - name: Render PR comment
              if: github.event_name == 'pull_request'
              run: |
                  cargo crap --lcov lcov.info \
                    --baseline main-baseline.json \
                    --format pr-comment --output crap-comment.md
                  echo "${{ github.event.pull_request.number }}" > pr-number.txt

            # Uploaded for the privileged workflow_run job to post. The CI run
            # itself only has read access on fork PRs, so commenting is deferred.
            - name: Upload PR comment artifact
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: crap-pr-comment
                  path: |
                      crap-comment.md
                      pr-number.txt
                  if-no-files-found: error

            # Gate on regressions, not absolute score: the codebase already
            # carries debt above threshold 30, so blocking on --fail-above
            # would be red on every PR. The trusted main baseline captures the
            # current scores; CI fails only when a function gets WORSE.
            # Refresh the in-tree baseline with: ./scripts/crap.sh \
            #   --format json --output .cargo-crap-baseline.json
            - run: cargo crap --lcov lcov.info --baseline main-baseline.json --fail-regression
