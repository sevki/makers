[workspace]
members = [
    "proc-macros",
]
[package]
name = "make-sys"
authors = ["C2Rust"]
version = "4.4.90"
publish = false
edition = "2021"
autobins = false

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
path = "bin/make.rs"
name = "make"

[dependencies]
bitflags = "2.13.0"
blake3 = "1.8.5"
c2rust-bitfields = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
digest = "0.10"
itertools = "0.12"
jj-lib-proc-macros = { path = "proc-macros" }
libc = "0.2"
salsa = "0.27"

[dev-dependencies]
insta = { version = "=1.34.0", default-features = false }
