# `plugins/compile-commands` is its own standalone workspace (see the
# `[workspace]` marker in Cargo.toml, same pattern as `fuzz/`) so it doesn't
# inherit the main crate's heavy dependency graph. Without this, `cargo
# component build` run from this directory writes to
# `plugins/compile-commands/target/` instead of the repo-root `target/` that
# `tests/plugin_compile_commands.rs` looks in.
[build]
target-dir = "../../target"
